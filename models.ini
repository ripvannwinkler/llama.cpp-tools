version = 1

; =============================================================================
; Per-model config for llama-server router mode.
; Referenced by start-llama.ps1 via --models-preset.
; Precedence (highest wins): CLI args  >  [model-id] section  >  [*] global.
; Section name = model id = the flat folder name under D:\llama.cpp\models.
; NOTE (2026-08-02): the two flagship presets now BOTH run the full trained
; 262144 (256k) ctx — the 35B-MTP at q8_0 KV, the 27B ThinkingCap at q5_1 KV.
; The old "q8_0 at 160k == q4_0 at 256k" rule of thumb that sized the earlier
; 163840 presets was over-conservative and has been retired; both were measured
; directly instead. The 26B MoE preset runs 262144 at q4_0 KV. The vision presets
; (Gemma-3-27B, both 8B) stay at q8_0 KV. Per-model VRAM/bench figures in the
; older comments below predate the current settings and are stale until
; re-verified; anything dated 2026-08-02 is measured.
; =============================================================================

[*]
n-gpu-layers = 99          ; offload all layers to the 5090
flash-attn   = on          ; required for quantized V cache
ctx-size     = 8192        ; fallback context if a model has no override
cache-type-k = q8_0        ; standard KV quant for all presets (near-lossless)
cache-type-v = q8_0
metrics      = on          ; exposes /metrics (n_decode_total) — the tray's auto-unload
                           ; idle detection uses this counter instead of point-in-time
                           ; /slots polling, which can miss short requests between ticks

; 27B dense (ThinkingCap-Qwen3.6-27B — bottlecapai/protoLabsAI ThinkingCap tune of
; Qwen3.6-27B, NVFP4, Apache 2.0). REPLACES the removed Qwen3.6-27B-NVFP4-pi-tune
; preset (sakakismile NVFP4, 163840 ctx @ q8_0), retired 2026-08-02 after the A/B
; below. Same arch: qwen35, 65 blocks, head_count_kv=4, key/value_length=256,
; trained ctx 262144. MTP is preserved (nextn_predict_layers = 1, header-verified),
; so spec-type = draft-mtp applies. 0 vision tensors in the main GGUF — the
; separate mmproj below is REQUIRED for vision; do not drop that line. (The
; retired pi-tune preset carried a comment claiming its vision encoder was
; embedded and needed no mmproj — a header parse showed 0 vision tensors there
; too, so that claim was simply wrong for both models.)
; Sold on THINKING EFFICIENCY, not raw capability: author reports ~50% fewer
; thinking tokens (90% best case) with LiveCodeBench 84.3 vs 80.7 (+3.6),
; MMLU-Pro 85.4 vs 85.9 (-0.5), GPQA-Diamond 83.8 vs 85.5 (-1.7). Those deltas
; are the AUTHOR's. Locally A/B'd 2026-08-02 vs the pi-tune preset (5 reasoning
; questions, both at 32768 ctx / q8_0 KV so only the model differs, temp 0):
;   pi-tune     11811 thinking chars, 3865 completion tok, 5/5 correct
;   ThinkingCap  8506 thinking chars, 2870 completion tok, 5/5 correct
; i.e. -28% thinking chars / -26% completion tokens at EQUAL accuracy. Real, but
; well short of the advertised ~50%. Spread is wide and task-dependent: -60% on a
; syllogism, +67% on letter-counting. Only 5 questions x 1 rep — treat the
; magnitude as uncertain (single samples have reversed twice in this repo's
; tuning history; see the spec-draft-n-max note on the 35B preset).
; CTX SWEPT 2026-08-02 at q8_0 KV, ngl 99, ub 512 (card 32607 MiB, idle 1767):
;   262144 : 31949 MiB peak ->  658 MiB free   TIGHT at q8_0
;   229376 : 31097 MiB peak -> 1510 MiB free
;   196608 : 29689 MiB peak -> 2918 MiB free
;   163840 : 28281 MiB peak -> 4326 MiB free
; q8_0 KV was never the BINDING constraint — even 262144 loads and generates at
; q8_0, just with only 658 MiB free. Rather than give up context for headroom,
; this preset trades KV precision instead: full 262144 at q5_1.
; q5_1 is 24 bytes / 32 elements = 0.75 B/elem vs q8_0's 34/32 = 1.0625 B/elem,
; i.e. ~71% of the cache size. See arg.cpp for the full list of legal KV types —
; F32, F16, BF16, Q8_0, Q5_1, Q5_0, IQ4_NL, Q4_1, Q4_0 — it is NOT a binary
; q8_0-or-q4_0 choice, and q5_1/q5_0 are the useful middle rungs.
; MEASURED 2026-08-02, 262144 @ q5_1: 30101 MiB used -> 2506 MiB free.
; That is only 1848 MiB saved vs q8_0 at the same ctx, NOT the ~3.2 GiB the
; 0.75/1.0625 byte ratio predicts — the per-token footprint also includes the
; MTP draft cache and ub-sized compute buffers, which do not scale with KV type.
; Net: full 262144 with MORE headroom than q8_0 could give at 229376 (1510 MiB).
; Drop to 196608 at q8_0 (2918 MiB free) if q5_1 ever looks lossy in practice.
; MEASURED per-token KV cost is ~44 KiB/token, NOT the ~34.5 KiB/token the GGUF
; geometry implies ((256+256) x 1.0625 x 65). The gap is the draft-mtp head's own
; KV cache — remember this when sizing any other MTP model.
; Depth-checked at 229376: VRAM grew only ~140 MiB from load to 50k depth (KV is
; preallocated), pp 4252 tok/s @15k / 2982 @50k.
; reasoning-preserve is deliberately NOT set here (unlike the 35B): it costs
; context on a model whose selling point is spending fewer thinking tokens.
; Enable it if multi-turn agentic loops need the earlier traces.
[ThinkingCap-Qwen3.6-27B]
cache-reuse        = 256
ctx-size           = 262144
batch-size         = 2048
ubatch-size        = 512
model              = D:\llama.cpp\models\ThinkingCap-Qwen3.6-27B\ThinkingCap-Qwen3.6-27B-NVFP4-MTP.gguf
mmproj             = D:\llama.cpp\models\ThinkingCap-Qwen3.6-27B\mmproj-ThinkingCap-Qwen3.6-27B-f16.gguf
cache-type-k       = q5_1
cache-type-v       = q5_1
spec-type          = draft-mtp
jinja              = on
chat-template-file = D:\llama.cpp\models\_templates\Qwen3-Fixed-Chat-Template.jinja

; 35B MoE (Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP — A3B active, Unsloth UD-Q4_K_XL).
; Replaces the NVFP4 quant. Ships MTP self-draft layers (gguf-dump:
; qwen35moe.nextn_predict_layers = 1), so spec-type = draft-mtp is enabled here
; (unlike the old NVFP4, which had MTP stripped and exited on load if spec-type
; was set). Runs the FULL trained 262144 (256k) ctx at q8_0 KV — no CPU offload
; needed. MEASURED 2026-08-02 (idle baseline 1541 MiB, 32607 MiB card):
;   256k q8_0, ngl 99, ncmoe 0 : 28790 MiB used -> 3.73 GiB free
;   256k q8_0, ngl 99, ncmoe 4 : 27082 MiB used -> 5.40 GiB free
;   256k q8_0, ngl 99, ncmoe 8 : 25226 MiB used -> 7.21 GiB free
; KV is cheap on this arch: head_count_kv=2, n_embd_k_gqa=256, so all 41 layers
; cost only ~21.8 KiB/token at q8_0 — 160k->256k is just ~+2 GiB, which is why
; the old "q8_0 at 160k == q4_0 at 256k" note was over-conservative.
; If you ever need more VRAM back, -ncmoe buys ~0.42 GiB per layer (experts are
; 18.74 of the 21.27 GiB of weights, 0.457 GiB/layer). ubatch 512.
; Custom fixed chat template (fixes tool-call rendering / agentic-loop bugs in
; the official Qwen3.6 template): froggeric/Qwen-Fixed-Chat-Templates, stored
; shared under models/_templates/. Requires jinja = on.
; DFlash drafter TESTED AND REJECTED 2026-08-02. z-lab/Qwen3.6-35B-A3B-DFlash
; (402 MB Q8_0, arch verified `dflash`) via spec-type = draft-dflash lost to the
; native MTP at every depth — tg 265.9/287.3/224.2/166.1/137.2 tok/s (MTP) vs
; 251.1/263.9/201.5/162.4/123.0 (DFlash) at short/15k/50k/100k/200k, i.e. 2-10%
; slower, plus 13% slower prompt eval and +1.1 GB VRAM (the drafter needs its own
; context). MTP is trained jointly with these weights so its acceptance rate is
; far higher than a bolt-on drafter's. Don't re-try this.
; spec-draft-n-max SWEPT 2026-08-02 — leave it UNSET (llama.cpp default 3).
; It is a live knob here: the n_max clamp in speculative.cpp is gated behind
; `chain_heads` (n_mtp_layers > 1), and this model has nextn_predict_layers = 1,
; so the single MTP head is run iteratively up to n_max times.
; Sweep (tg tok/s, short / ~50k): 1=244/166  2=274/216  3=271/199  4=263/169
;   6=260/196  8=134/81 — n_max 8 roughly HALVES throughput, don't go high.
; 2 vs 3 re-tested interleaved, 3 reps each (single samples were misleading):
;   n_max=2  short 281.3 (273.9-285.8)   ~50k 183.5 (182.9-184.0)
;   n_max=3  short 270.8 (269.1-273.5)   ~50k 205.8 (193.9-223.3)
; Optimum is DEPTH-DEPENDENT: 2 wins by 3.9% on short prompts, 3 wins by 12.2%
; at 50k (non-overlapping ranges both ways). At depth each verify costs a full
; attention pass over the context, so accepting more tokens per verify pays;
; at short ctx the verify is cheap and wasted draft compute dominates. This
; preset is used for long-context agentic work, so 3 (the default) is correct.
[Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP]
cache-reuse        = 256
ctx-size           = 262144
batch-size         = 2048
; ubatch SWEPT 2026-08-02, 2 reps each (pp tok/s @15k/50k/200k, tg @50k, peak VRAM):
;   512  : 7237/6773/4107  tg 203-208  30.2 GB   <- previous value
;   1024 : 9256/8532/4808  tg 194-209  30.8 GB   <- CHOSEN: pp +26%, tg unchanged
;   2048 : 9839/9051/4990  tg 134-157  31.9 GB   <- REJECTED
; 2048 buys only ~4% more pp over 1024 but costs ~29% of generation speed and
; leaves just 0.75 GiB VRAM free. 1024 leaves ~1.8 GiB (down from ~2.4 at 512) —
; that is the price of the pp gain; drop back to 512 if you need the headroom.
ubatch-size        = 1024
cache-type-k       = q8_0
cache-type-v       = q8_0
spec-type          = draft-mtp
model              = D:\llama.cpp\models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP\Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
jinja              = on
chat-template-file = D:\llama.cpp\models\_templates\Qwen3-Fixed-Chat-Template.jinja
; llama-server logs "chat template supports preserving reasoning, consider
; enabling it via --reasoning-preserve" on every load — the froggeric template
; advertises supports_preserve_reasoning. This keeps the reasoning trace for ALL
; prior assistant turns instead of only the most recent one, which helps
; multi-turn agentic loops (the model can see why it made earlier decisions).
; Costs context, which is affordable at 262144.
; NOTE ON "THINKING LEVELS": this model has NO low/medium/high effort levels.
; Both templates are binary — the froggeric one and the GGUF's embedded one
; expose only `enable_thinking`; neither reads `reasoning_effort`, so sending
; that param is silently a no-op here (the server forwards it, the template
; ignores it). The graded equivalent is a TOKEN BUDGET instead:
;   --reasoning-budget N        server-wide default (-1 unrestricted, 0 = off)
;   --reasoning-budget-message  text injected when the budget is exhausted
;   reasoning_budget_tokens     PER-REQUEST body param (overrides the default)
; Left unset here so callers can choose per request.
reasoning-preserve = on

; 26B MoE (Gemma-4-26B-A4B-it-QAT — A4B active) — trained ctx is 262144. Replaces
; the removed Gemma-4-31B-it-QAT dense preset. Runs the full 262144 ctx at q4_0 KV
; (q4_0 keeps the cache compact enough to fit that length). ubatch 512.
[Gemma-4-26B-A4B-it-QAT]
cache-reuse  = 256
ctx-size     = 262144
batch-size   = 2048
ubatch-size  = 512
cache-type-k = q4_0
cache-type-v = q4_0

; 27B dense vision (Gemma-3-27B-it-abliterated — Gemma 3 27B, mlabonne abliterated
; GGUF — q4_k_m + f16 mmproj shipped premade in the repo, no local build).
; Uncensored, image-text-to-text. Trained ctx 131072 (128k). KV q8_0 (inherited
; from [*], set explicit for clarity). Gemma 3 uses interleaved local(1024
; sliding)/global attention, so KV stays modest at 128k despite 27B size — 16.5GB
; weights + 0.86GB mmproj still leaves headroom on the 32GB 5090 (load-verified).
; ub 1024 per the dense-model bench figure.
[Gemma-3-27B-it-abliterated]
model        = D:\llama.cpp\models\Gemma-3-27B-it-abliterated\gemma-3-27b-it-abliterated.q4_k_m.gguf
mmproj       = D:\llama.cpp\models\Gemma-3-27B-it-abliterated\mmproj-mlabonne_gemma-3-27b-it-abliterated-f16.gguf
cache-reuse  = 256
ctx-size     = 131072
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 8B vision (Qwen3-VL-8B-Instruct) — full context fits once KV is quantized
[Qwen3-VL-8B-Instruct (Uncensored)]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 65536
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 8B LITE (Qwen3-VL-8B-Instruct, Lite) — SAME file, fixed 8192 ctx for a small
; VRAM footprint while doing other GPU-heavy work. Request model "qwen3-vl-8b-lite".
[Qwen3-VL-8B-Instruct (Lite, Uncensored)]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 4096
batch-size   = 1024
ubatch-size  = 256
cache-type-k = q8_0
cache-type-v = q8_0
