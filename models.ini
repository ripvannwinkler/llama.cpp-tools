# Vision deliberately disabled: the BF16 mmproj costs ~1.0 GB of VRAM, spent on
# f16 KV instead. Dropping the `mmproj =` line is NOT enough — the router
# auto-discovers any *.gguf in the model dir whose name contains "mmproj"
# (common/preset.cpp is_mmproj_file), so the file is renamed to
# `mmproj-BF16.gguf.old`. To restore image input: rename it back AND drop
# ctx-size to ~147456.
reasoning-format     = deepseek
reasoning            = on
reasoning-preserve   = on
