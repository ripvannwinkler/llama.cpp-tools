version = 1

; =============================================================================
; Per-model config for llama-server router mode.
; Referenced by start-llama.ps1 via --models-preset.
; Precedence (highest wins): CLI args  >  [model-id] section  >  [*] global.
; Section name = model id = the flat folder name under D:\llama.cpp\models.
; ctx-size = max that loads in the ROUTER at q8_0 KV on the 32 GB 5090 (verified).
; =============================================================================

[*]
n-gpu-layers = 99          ; offload all layers to the 5090
flash-attn   = on          ; required for quantized V cache
ctx-size     = 8192        ; fallback context if a model has no override
metrics      = on          ; exposes /metrics (n_decode_total) — the tray's auto-unload
                           ; idle detection uses this counter instead of point-in-time
                           ; /slots polling, which can miss short requests between ticks

; 35B MoE — full trained context fits (small KV from MoE)
; ub 2048: +8.6% pp vs 1024 (llama-bench pp4096: 11914 -> 12944 t/s), 27.8GB @262k
[Qwen3.6-35B-A3B-NVFP4]
ctx-size     = 262144
batch-size   = 2048
ubatch-size  = 2048
cache-type-k = q8_0
cache-type-v = q8_0

; 27B dense — MTP self-draft: 71 -> 146 t/s greedy coding (87% acceptance).
; ctx reduced from the 196k max: 29.5GB @160k vs 31.1GB @196k (~49KB/token),
; keeps ~3GB headroom with the MTP draft ctx. ub stays 1024 (2048 gained only
; 1.3% pp on dense).
[Qwen3.6-27B-Fable-Fusion-711-Uncensored-Heretic-MTP]
ctx-size     = 163840
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0
spec-type    = draft-mtp

; 26B MoE (A4B active) — trained ctx is 262144; verified to load at q8 KV on the 5090
; (23.2/32.6GB VRAM). Replaces the removed Gemma-4-31B-it-QAT dense preset.
; ub 2048: 21.8GB @262k verified
[Gemma-4-26B-A4B-it-QAT]
ctx-size     = 262144
batch-size   = 2048
ubatch-size  = 2048
cache-type-k = q8_0
cache-type-v = q8_0

; 35B MoE (agentic coding, Qwen3.5-MoE-based) — Unsloth UD-Q4_K_XL (22.3GB),
; same footprint class as Qwen3.6-35B-A3B-NVFP4 (22.5GB) which fits full ctx
; at q8 KV.
; ub 2048: 28.0GB @262k verified
[Ornith-1.0-35B]
ctx-size     = 262144
batch-size   = 2048
ubatch-size  = 2048
cache-type-k = q8_0
cache-type-v = q8_0

; 8B vision — full context fits once KV is q8
[Qwen3-VL-8B-Instruct (Uncensored)]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 65536
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 8B LITE — SAME file, fixed 8192 ctx for a small VRAM footprint while doing other
; GPU-heavy work. Request model "qwen3-vl-8b-lite".
[Qwen3-VL-8B-Instruct (Lite, Uncensored)]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 4096
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 7B vision — ctx caps to the model's trained max of 128000
[Qwen2.5-VL-7B-NSFW-Caption-V3-abliterated]
ctx-size     = 65536
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0
