version = 1

; =============================================================================
; Per-model config for llama-server router mode.
; Referenced by start-llama.ps1 via --models-preset.
; Precedence (highest wins): CLI args  >  [model-id] section  >  [*] global.
; Section name = model id = the flat folder name under D:\llama.cpp\models.
; ctx-size = max that loads in the ROUTER at q8_0 KV on the 32 GB 5090.
; NOTE (2026-07-29): KV cache standardized to q8_0 across all presets (near-
; lossless) and the two big presets (27B/35B) capped at 128k ctx; per-model VRAM
; figures in the older comments below predate this and are stale until re-verified.
; =============================================================================

[*]
n-gpu-layers = 99          ; offload all layers to the 5090
flash-attn   = on          ; required for quantized V cache
ctx-size     = 8192        ; fallback context if a model has no override
cache-type-k = q8_0        ; standard KV quant for all presets (near-lossless)
cache-type-v = q8_0
metrics      = on          ; exposes /metrics (n_decode_total) — the tray's auto-unload
                           ; idle detection uses this counter instead of point-in-time
                           ; /slots polling, which can miss short requests between ticks

; 27B dense (stock Qwen3.6-27B, Unsloth UD-Q4_K_XL) — replaces the removed
; Fable-Fusion-711 MTP preset. ctx capped at 128k (131072); the full trained
; 262144 also fit at q8_0 KV (30.3GB used, ~2.3GB headroom, verified 2026-07-28)
; so 128k leaves ample margin. KV q8_0 (near-lossless) — llama-bench pp512/tg128
; came back within noise of q4_0, so q8_0 is pure upside. Re-check this preset
; first if VRAM gets tight from other GPU load. No MTP self-draft layers in this
; gguf (checked via gguf-dump: no mtp/draft/nextn tensors) — do not set spec-type,
; it will exit on load. ub stays 1024 (matches the dense-model bench figure:
; 2048 only gained 1.3% pp).
[Qwen3.6-27B-UD-Q4_K_XL]
cache-reuse        = 256
ctx-size           = 131072
batch-size         = 2048
ubatch-size        = 1024
cache-type-k       = q8_0
cache-type-v       = q8_0
; Custom fixed chat template — see froggeric/Qwen-Fixed-Chat-Templates note on
; the 35B preset below; the template covers all Qwen 3.6 variants.
jinja              = on
chat-template-file = D:\llama.cpp\models\_templates\Qwen3-Fixed-Chat-Template.jinja

; 35B MoE (A3B active) — Unsloth UD-Q4_K_XL. Replaces the NVFP4 quant.
; Ships MTP self-draft layers (gguf-dump: qwen35moe.nextn_predict_layers = 1),
; so spec-type = draft-mtp is enabled here (unlike the old NVFP4, which had MTP
; stripped and exited on load if spec-type was set). Full trained ctx 262144,
; capped here at 128k (131072). Vision-enabled via mmproj-F16.gguf. KV q8_0
; (near-lossless); the full 262144 nearly filled VRAM at q8_0 (~850MB headroom),
; so the 128k cap leaves comfortable margin. ub 2048 per the MoE bench figure
; (+8.6% pp vs 1024).
; Custom fixed chat template (fixes tool-call rendering / agentic-loop bugs in
; the official Qwen 3.6 template): froggeric/Qwen-Fixed-Chat-Templates, stored
; shared under models/_templates/. Requires jinja = on.
[Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP]
cache-reuse        = 256
ctx-size           = 131072
batch-size         = 2048
ubatch-size        = 2048
cache-type-k       = q8_0
cache-type-v       = q8_0
spec-type          = draft-mtp
model              = D:\llama.cpp\models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP\Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj             = D:\llama.cpp\models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP\mmproj-F16.gguf
jinja              = on
chat-template-file = D:\llama.cpp\models\_templates\Qwen3-Fixed-Chat-Template.jinja

; 26B MoE (A4B active) — trained ctx is 262144. Replaces the removed
; Gemma-4-31B-it-QAT dense preset. KV q8_0 (near-lossless, standardized 2026-07-29).
; ub 2048: 21.8GB @262k figure was measured at q8_0 KV.
[Gemma-4-26B-A4B-it-QAT]
cache-reuse  = 256
ctx-size     = 262144
batch-size   = 2048
ubatch-size  = 2048
cache-type-k = q8_0
cache-type-v = q8_0

; 27B dense vision (Gemma 3 27B, mlabonne abliterated GGUF — q4_k_m + f16 mmproj
; shipped premade in the repo, no local build). Uncensored, image-text-to-text.
; Trained ctx 131072 (128k). KV q8_0 (inherited from [*], set explicit for clarity).
; Gemma 3 uses interleaved local(1024 sliding)/global attention, so KV stays modest
; at 128k despite 27B size — 16.5GB weights + 0.86GB mmproj still leaves headroom on
; the 32GB 5090 (load-verified). ub 1024 per the dense-model bench figure.
[Gemma-3-27B-it-abliterated]
model        = D:\llama.cpp\models\Gemma-3-27B-it-abliterated\gemma-3-27b-it-abliterated.q4_k_m.gguf
mmproj       = D:\llama.cpp\models\Gemma-3-27B-it-abliterated\mmproj-mlabonne_gemma-3-27b-it-abliterated-f16.gguf
cache-reuse  = 256
ctx-size     = 131072
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 8B vision — full context fits once KV is quantized
[Qwen3-VL-8B-Instruct (Uncensored)]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 65536
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 8B LITE — SAME file, fixed 8192 ctx for a small VRAM footprint while doing other
; GPU-heavy work. Request model "qwen3-vl-8b-lite".
[Qwen3-VL-8B-Instruct (Lite, Uncensored)]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 4096
batch-size   = 1024
ubatch-size  = 256
cache-type-k = q8_0
cache-type-v = q8_0
