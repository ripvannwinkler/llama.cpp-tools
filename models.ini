version = 1

; =============================================================================
; Per-model config for llama-server router mode.
; Referenced by start-llama.ps1 via --models-preset.
; Precedence (highest wins): CLI args  >  [model-id] section  >  [*] global.
; Section name = model id = the flat folder name under D:\llama.cpp\models.
; ctx-size = max that loads in the ROUTER at q8_0 KV on the 32 GB 5090 (verified).
; =============================================================================

[*]
n-gpu-layers = 99          ; offload all layers to the 5090
flash-attn   = on          ; required for quantized V cache
ctx-size     = 8192        ; fallback context if a model has no override

; 35B MoE — full trained context fits (small KV from MoE)
[Qwen3.6-35B-A3B-NVFP4]
ctx-size     = 262144
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 27B dense — full trained context fits at q8 KV
[Qwen3.6-27B-Fable-Fusion-711-Uncensored-Heretic-MTP]
ctx-size     = 196608
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 31B dense — full 262144 context enabled by q5_1 KV (q8 only fit 196608)
[Gemma-4-31B-it-QAT]
ctx-size     = 262144
batch-size   = 2048
cache-type-k = q5_1
cache-type-v = q5_1

; 8B vision — full context fits once KV is q8
[Qwen3-VL-8B-Instruct]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 65536
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 8B LITE — SAME file, fixed 8192 ctx for a small VRAM footprint while doing other
; GPU-heavy work. Request model "qwen3-vl-8b-lite".
[qwen3-vl-8b-lite]
model        = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
mmproj       = D:\llama.cpp\models\Qwen3-VL-8B-Instruct\mmproj-Qwen3-VL-8B-Instruct-F16.gguf
ctx-size     = 4096
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0

; 7B vision — ctx caps to the model's trained max of 128000
[Qwen2.5-VL-7B-NSFW-Caption-V3-abliterated]
ctx-size     = 65536
batch-size   = 2048
ubatch-size  = 1024
cache-type-k = q8_0
cache-type-v = q8_0
