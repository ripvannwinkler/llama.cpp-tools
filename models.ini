version = 1

[*]
cache-ram    = 2048
cache-reuse  = 256
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size     = 65536
fit          = on
fit-target   = 4096
flash-attn   = on
kv-unified   = on
load-mode    = mmap
metrics      = on
min-p        = 0.0
n-gpu-layers = auto
parallel     = 2

# Light backup token-level repeat penalty, wide lookback to catch
# paragraph-scale loops (llama.cpp default repeat-last-n=64 is too short).
repeat-last-n  = 4096
repeat-penalty = 1.05
temp         = 0.6
threads      = 8

[Ornith-1.5-35B-A3B]
batch-size         = 4096
ctx-size           = 262144
jinja              = on
model              = D:\llama.cpp\models\Ornith-1.5-35B-A3B\Ornith-1.5-35B-Q8_0.gguf
presence-penalty   = 1.5
reasoning          = on
reasoning-preserve = on
temp               = 1.0
tensor-split       = 47,53
top-k              = 20
top-p              = 0.95
ubatch-size        = 1024

